<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHospital - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 2.75rem;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .login-alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .login-alert.error {
            background-color: var(--status-occupied-bg);
            color: #991b1b;
            border: 1px solid var(--status-occupied-border);
            display: block;
        }

        .login-alert.info {
            background-color: var(--status-available-bg);
            color: #065f46;
            border: 1px solid var(--status-available-border);
            display: block;
        }

        .login-footer-note {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        .login-footer-note code {
            background: #f1f5f9;
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            font-family: monospace;
            color: var(--primary);
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🏥</div>
            <h1>SmartHospital</h1>
            <p>Bed Management & Allocation Optimization</p>
        </div>

        <div id="login-alert" class="login-alert"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="btn-submit" class="btn btn-primary full-width" style="margin-top: 0.5rem; padding: 0.75rem;">
                Sign In
            </button>
        </form>

        <div class="login-footer-note">
            <strong>Initial Setup Note:</strong><br>
            If no Admin account exists, set the <code>SMART_HOSPITAL_ADMIN_PASSWORD</code> environment variable before starting the server.
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
