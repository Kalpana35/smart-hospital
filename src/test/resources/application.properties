# ===================================================================
# Test Database Isolation Configuration
# All automated integration tests run against this in-memory H2 database.
# Development database (MySQL 'smart_hospital_db') is never touched by tests.
# ===================================================================
spring.application.name=smart-hospital-test

# In-memory H2 Database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:smart_hospital_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-generate schema for in-memory DB and drop on test completion
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Test environment bootstrap configuration
SMART_HOSPITAL_ADMIN_PASSWORD=TestAdminPassword@123

